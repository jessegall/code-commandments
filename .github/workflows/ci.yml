# Every push and pull request: the Go suite, a release build held to its size budgets, and the memory gate over the
# fixtures and a real codebase. Every Go command runs in the capped dev container (scripts/dev: 3 GB, 2 CPUs), and
# the Roslyn bridge image is built here, in CI, never on a user's machine.
name: CI

on:
  push:
    branches: [main, go-rewrite]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Roslyn bridge image
        run: docker build -t "$(cat bridge/roslyn/IMAGE)" bridge/roslyn
      - name: Vet
        run: scripts/dev env GOMEMLIMIT=3GiB GOMAXPROCS=2 go vet -p 2 ./...
      - name: Test
        run: scripts/dev env GOMEMLIMIT=3GiB GOMAXPROCS=2 go test -p 2 -parallel 2 -timeout 60m ./...
      - name: The generated documents are current
        run: |
          scripts/dev env GOMEMLIMIT=3GiB GOMAXPROCS=2 go run ./skill/render/generate --check
          scripts/dev env GOMEMLIMIT=3GiB GOMAXPROCS=2 go run ./cli/doc/readme
          scripts/dev env GOMEMLIMIT=3GiB GOMAXPROCS=2 go run ./cli/doc/refresh
          git diff --exit-code

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile, check and sum
        run: scripts/dev env GOMEMLIMIT=3GiB GOMAXPROCS=2 scripts/release/build "ci-${GITHUB_SHA::12}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: commandments-${{ github.sha }}
          path: dist/

  memory:
    runs-on: ubuntu-latest
    env:
      KOEL_COMMIT: 7f321705d7afc31a60181e8c6eab85c0220869bf
    steps:
      - uses: actions/checkout@v4
      - name: Build the Roslyn bridge image
        run: docker build -t "$(cat bridge/roslyn/IMAGE)" bridge/roslyn
      - name: The fixtures stay within their memory budget
        run: scripts/memory/gate.sh fixtures tests/Fixtures
      - name: Snapshot koel at its pinned commit
        run: |
          git clone --quiet --filter=blob:none https://github.com/koel/koel.git "$RUNNER_TEMP/koel-checkout"
          scripts/memory/snapshot.sh "$RUNNER_TEMP/koel-checkout" "$KOEL_COMMIT" "$RUNNER_TEMP/koel"
      - name: koel stays within its memory budget
        run: scripts/memory/gate.sh koel "$RUNNER_TEMP/koel"
