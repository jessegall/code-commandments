# A release, run only by a v* tag — and only Sir Jesse tags: the binaries for every platform with their SHA256SUMS
# on the GitHub release, and the Roslyn bridge image, built for amd64 and arm64, pushed to the registry the binary
# pulls it from. Nothing else publishes, and no agent pushes a tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile, check and sum
        run: scripts/dev env GOMEMLIMIT=3GiB GOMAXPROCS=2 scripts/release/build "$GITHUB_REF_NAME" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  roslyn-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the Roslyn bridge image
        run: docker buildx build --platform linux/amd64,linux/arm64 --tag "$(cat bridge/roslyn/IMAGE)" --push bridge/roslyn
