name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version with its v prefix
        required: true
        type: string
      commit:
        description: Full SHA of the release commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_COMMIT: ${{ inputs.commit }}

jobs:
  # A tag is a version of the plugin. Its manifests fetch the binary COMMANDMENTS_RELEASE pins: a tag that pins itself
  # builds that binary here; a tag that pins an earlier release changed only the plugin's own files, runs the binary
  # that release built, and publishes nothing, so a change to how the plugin handles events ships in seconds.
  pin:
    # 24.04: the newest runner that still offers the Python 3.9 macOS runs the plugin's script under.
    runs-on: ubuntu-24.04
    outputs:
      # Whether this tag builds its binary: false when it runs an earlier release's.
      builds: ${{ steps.pin.outputs.builds }}
      # The release the C# bridges can be taken from, empty when they must be built. A bridge is a self-contained
      # runtime per platform, five of the six minutes a release takes and two of them on a macOS runner, and for a
      # release that did not touch the bridge the assets are byte for byte the last release's.
      bridges-from: ${{ steps.bridges.outputs.from }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the release commit and unused version
        run: |
          if [[ "$RELEASE_COMMIT" != "$GITHUB_SHA" || "$RELEASE_COMMIT" != "$(git rev-parse HEAD)" ]]; then
            echo "Expected release commit $RELEASE_COMMIT but checked out $(git rev-parse HEAD)" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release version of the form vX.Y.Z" >&2
            exit 1
          fi
          existing="$(git ls-remote --tags --refs origin "refs/tags/$RELEASE_VERSION")"
          if [ -n "$existing" ]; then
            echo "Version $RELEASE_VERSION already has a public tag" >&2
            exit 1
          fi
      # The plugin's script runs under whatever python3 the hooks find, which on macOS is 3.9; its tests run there
      # before anything is published, so a tag that changes only the script is still proven.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: The plugin's script passes its tests on Python 3.9
        run: python -m unittest discover -v -s .journal-plugin/tests
      - name: The plugin is this version, and fetches a binary built here or already released
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(jq -r .version .journal-plugin/plugin.json)"
          if [ "$version" != "$RELEASE_VERSION" ]; then
            echo ".journal-plugin/plugin.json says version $version, expected $RELEASE_VERSION" >&2
            exit 1
          fi

          pinned="$(scripts/release/pin)"
          # journal-plugin.json is frozen for journals before version 5 and fetches its own release for good.
          for manifest in journal-plugin.*.json; do
            fetched="$(jq -r '.setup[] | .run' "$manifest" | sed -n 's/^COMMANDMENTS_RELEASE=\([^ ]*\) .*/\1/p' | head -1)"
            if [ "$fetched" != "$pinned" ]; then
              echo "$manifest fetches $fetched, not $pinned" >&2
              exit 1
            fi
          done

          if [ "$pinned" = "$RELEASE_VERSION" ]; then
            echo "builds=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only the plugin's own files, the rule files the binary reads loose, the fixtures, test data and the
          # generated READMEs may differ from the release whose binary this tag runs; anything else is what the binary
          # is built from, and then the tag must pin itself so it is built.
          changed="$(git diff --name-only "refs/tags/$pinned" "$RELEASE_COMMIT")"
          built_from="$(grep -v -E '^(\.journal-plugin/|journal-plugin(\.[0-9]+)*\.json$|rules/.+\.json$|tests/|.+/testdata/|README[^/]*\.md$)' <<< "$changed" || true)"
          if [ -n "$built_from" ]; then
            echo "$RELEASE_VERSION runs the binary of $pinned, but these files it is built from changed since; pin $RELEASE_VERSION so it is built:" >&2
            echo "$built_from" >&2
            exit 1
          fi

          held="$(gh release view "$pinned" --json assets -q '.assets | length' 2>/dev/null || echo 0)"
          if [ "$held" = "0" ]; then
            echo "$RELEASE_VERSION runs the binary of $pinned, which holds no assets to fetch" >&2
            exit 1
          fi

          # The pinned binary reads this commit's rules folder loose: every rule must load in it, or the release
          # would ship rules it cannot run.
          COMMANDMENTS_RELEASE="$pinned" sh .journal-plugin/fetch
          bin/commandments-release rule check

          echo "builds=false" >> "$GITHUB_OUTPUT"
          echo "$RELEASE_VERSION changes only the plugin's files and runs the binary of $pinned, so nothing is built" >&2
      - name: Take the C# bridges from the last release where nothing of them changed
        id: bridges
        if: steps.pin.outputs.builds == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
          [ -n "$previous" ] || exit 0

          # What a bridge is built from: its own sources, the script that publishes it, and this workflow, which
          # names the SDK it is built with. A change anywhere in them is a bridge that must be built; everything
          # else about a release leaves it identical.
          if ! git diff --quiet "refs/tags/$previous" "$RELEASE_COMMIT" -- bridge/roslyn scripts/release/roslyn .github/workflows/release.yml; then
            echo "the bridge changed since $previous, so it is built" >&2
            exit 0
          fi

          expected="$(jq -r '.budget | keys[] | select(startswith("roslyn-bridge-"))' scripts/release/size-budget.json)"
          published="$(gh release view "$previous" --json assets -q '[.assets[].name | select(startswith("roslyn-bridge-"))] | sort[]' 2>/dev/null || true)"
          if [ "$published" != "$expected" ]; then
            echo "$previous does not have the expected bridge assets, so they are built" >&2
            exit 0
          fi

          echo "from=$previous" >> "$GITHUB_OUTPUT"
          echo "the bridges come from $previous" >&2

  bridges:
    needs: pin
    if: needs.pin.outputs.builds == 'true' && needs.pin.outputs.bridges-from == ''
    strategy:
      matrix:
        include:
          # A macOS bridge is published on macOS, whose signature the system requires to run it.
          - runner: macos-latest
            platforms: darwin/arm64 darwin/amd64
          - runner: ubuntu-latest
            platforms: linux/amd64 linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish the C# bridge for each platform
        run: for platform in ${{ matrix.platforms }}; do scripts/release/roslyn "$platform" dist; done
      - uses: actions/upload-artifact@v4
        with:
          name: bridges-${{ matrix.runner }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  binaries:
    needs: [pin, bridges]
    # The bridges job is skipped where they are taken from the last release, and a skipped job must not skip this one.
    if: ${{ !cancelled() && needs.pin.result == 'success' && needs.pin.outputs.builds == 'true' && (needs.bridges.result == 'success' || needs.bridges.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.pin.outputs.bridges-from == ''
        with:
          pattern: bridges-*
          path: dist
          merge-multiple: true
      - name: Take the C# bridges from the release that already holds them
        if: needs.pin.outputs.bridges-from != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGES_FROM: ${{ needs.pin.outputs.bridges-from }}
        run: |
          mkdir -p dist
          gh release download "$BRIDGES_FROM" --pattern 'roslyn-bridge-*' --dir dist
          ls -l dist
      - name: Cross-compile, check every binary against its budget, and sum them all
        run: scripts/dev env GOMEMLIMIT=3GiB GOMAXPROCS=2 scripts/release/build "$RELEASE_VERSION" dist
      - name: Compress and verify the command binaries for plugin setup
        working-directory: dist
        shell: bash
        run: |
          for binary in commandments-*; do
            gzip -n -9 -k "$binary"
            gzip -dc "$binary.gz" | cmp "$binary" -
          done
          sums="$(mktemp SHA256SUMS.XXXXXX)"
          cat SHA256SUMS > "$sums"
          sha256sum commandments-*.gz >> "$sums"
          mv -f "$sums" SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.version }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [pin, binaries]
    if: >-
      ${{ !cancelled() && needs.pin.result == 'success' &&
          (needs.binaries.result == 'success' ||
           (needs.pin.outputs.builds == 'false' && needs.binaries.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.pin.outputs.builds == 'true'
        with:
          name: release-${{ inputs.version }}
          path: dist
      - name: Verify the built assets
        if: needs.pin.outputs.builds == 'true'
        working-directory: dist
        run: sha256sum --strict --check SHA256SUMS
      - name: Create the public tag for the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="refs/tags/$RELEASE_VERSION"
          existing="$(git ls-remote --tags --refs origin "$ref")"
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] && [ "$existing" = "$(printf '%s\t%s' "$RELEASE_COMMIT" "$ref")" ]; then
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="$ref" -f sha="$RELEASE_COMMIT"
      - name: Publish the verified assets
        if: needs.pin.outputs.builds == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ] && [ "$(gh release view "$RELEASE_VERSION" --json isDraft -q '.isDraft' 2>/dev/null || true)" = false ]; then
            exit 0
          fi
          gh release create "$RELEASE_VERSION" dist/* --title "$RELEASE_VERSION" --generate-notes --verify-tag
      - name: Drop the assets of every release but the newest twenty
        if: needs.pin.outputs.builds == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Keep older tags and release notes after pruning their binaries.
        run: |
          # The release journal-plugin.json pins for journals before version 5 keeps its assets for good.
          frozen="$(jq -r '.setup[] | .run' journal-plugin.json | sed -n 's/^COMMANDMENTS_RELEASE=\([^ ]*\) .*/\1/p' | head -1)"
          gh api repos/${{ github.repository }}/releases --paginate -q '.[] | "\(.id) \(.tag_name)"' | tail -n +21 | while read -r release tag; do
            [ "$tag" = "$frozen" ] && continue
            assets="$(gh api "repos/${{ github.repository }}/releases/$release/assets" --paginate -q '.[].id')"

            # Every release older than the first one with nothing left was pruned by an earlier run, so the walk
            # stops there. Without this it asked after all 170 of them on every release, minutes of nothing.
            [ -n "$assets" ] || break

            printf '%s\n' "$assets" | while read -r asset; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset" >/dev/null || true
            done
          done
