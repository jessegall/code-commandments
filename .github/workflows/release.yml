# A release, run only by a v* tag — and only Sir Jesse tags: the tool's binary for every platform and the C# bridge
# beside it, each a plain executable a user runs with nothing else installed, with their SHA256SUMS, on the GitHub
# release the tool fetches them from. Nothing else publishes, and no agent pushes a tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The journal plugin fetches the release its manifest pins, for version 3 of the journal and for version 4, so a tag
  # whose checkout pins another would install a binary that is not its own.
  pin:
    runs-on: ubuntu-latest
    outputs:
      # The release the C# bridges can be taken from, empty when they must be built. A bridge is a self-contained
      # runtime per platform, five of the six minutes a release takes and two of them on a macOS runner, and for a
      # release that did not touch the bridge the six assets are byte for byte the last release's.
      bridges-from: ${{ steps.bridges.outputs.from }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The journal plugin pins this release
        run: |
          pinned="$(jq -r .env.COMMANDMENTS_RELEASE .journal-plugin/plugin.json)"
          if [ "$pinned" != "$GITHUB_REF_NAME" ]; then
            echo ".journal-plugin/plugin.json pins $pinned in COMMANDMENTS_RELEASE, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
          for manifest in journal-plugin*.json; do
            fetched="$(jq -r '.setup[] | .run' "$manifest" | sed -n 's/^COMMANDMENTS_RELEASE=\([^ ]*\) .*/\1/p' | head -1)"
            if [ "$fetched" != "$GITHUB_REF_NAME" ]; then
              echo "$manifest fetches $fetched, not $GITHUB_REF_NAME" >&2
              exit 1
            fi
          done

      - name: Take the C# bridges from the last release where nothing of them changed
        id: bridges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git tag --sort=-version:refname --list 'v*' | grep -v "^$GITHUB_REF_NAME$" | head -1)"
          [ -n "$previous" ] || exit 0

          # What a bridge is built from: its own sources, the script that publishes it, and this workflow, which
          # names the SDK it is built with. A change anywhere in them is a bridge that must be built; everything
          # else about a release leaves it identical.
          if ! git diff --quiet "$previous" "$GITHUB_REF_NAME" -- bridge/roslyn scripts/release/roslyn .github/workflows/release.yml; then
            echo "the bridge changed since $previous, so it is built" >&2
            exit 0
          fi

          published="$(gh release view "$previous" --json assets -q '[.assets[] | select(.name | startswith("roslyn-bridge-"))] | length' 2>/dev/null || echo 0)"
          if [ "$published" != "6" ]; then
            echo "$previous publishes $published bridges, not six, so they are built" >&2
            exit 0
          fi

          echo "from=$previous" >> "$GITHUB_OUTPUT"
          echo "the bridges come from $previous" >&2

  bridges:
    needs: pin
    if: needs.pin.outputs.bridges-from == ''
    strategy:
      matrix:
        include:
          # A macOS bridge is published on macOS, whose signature the system requires to run it.
          - runner: macos-latest
            platforms: darwin/arm64 darwin/amd64
          - runner: ubuntu-latest
            platforms: linux/amd64 linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish the C# bridge for each platform
        run: for platform in ${{ matrix.platforms }}; do scripts/release/roslyn "$platform" dist; done
      - uses: actions/upload-artifact@v4
        with:
          name: bridges-${{ matrix.runner }}
          path: dist/

  binaries:
    needs: [pin, bridges]
    # The bridges job is skipped where they are taken from the last release, and a skipped job must not skip this one.
    if: always() && needs.pin.result == 'success' && (needs.bridges.result == 'success' || needs.bridges.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.pin.outputs.bridges-from == ''
        with:
          pattern: bridges-*
          path: dist
          merge-multiple: true
      - name: Take the C# bridges from the release that already holds them
        if: needs.pin.outputs.bridges-from != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ needs.pin.outputs.bridges-from }}" --pattern 'roslyn-bridge-*' --dir dist
          ls -l dist
      - name: Cross-compile, check every binary against its budget, and sum them all
        run: scripts/dev env GOMEMLIMIT=3GiB GOMAXPROCS=2 scripts/release/build "$GITHUB_REF_NAME" dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag can be delivered twice, and then the second run builds the same binaries and finds the release
        # already there. Uploading them over it leaves the tag published either way, and heals a run that created
        # the release and failed before every asset was on it.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Drop the assets of every release but the newest twenty
        env:
          GH_TOKEN: ${{ github.token }}
        # The assets are what the storage is: a release carries six tool binaries, six C# bridges that each ship
        # their own runtime, and the sums over them, about 350 MB. Nothing deleted them, so 192 releases held
        # 63.6 GB. The tags and the notes stay, so the history reads as it did; only a version older than the
        # twenty newest can no longer be installed, which a consumer answers by moving to one that is.
        run: |
          gh api repos/${{ github.repository }}/releases --paginate -q '.[].id' | tail -n +21 | while read -r release; do
            assets="$(gh api "repos/${{ github.repository }}/releases/$release/assets" --paginate -q '.[].id')"

            # Every release older than the first one with nothing left was pruned by an earlier run, so the walk
            # stops there. Without this it asked after all 170 of them on every release, minutes of nothing.
            [ -n "$assets" ] || break

            printf '%s\n' "$assets" | while read -r asset; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset" >/dev/null || true
            done
          done
